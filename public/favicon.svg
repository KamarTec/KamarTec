<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#grad)" />
  <!-- Shine overlay -->
  <rect width="100" height="50" rx="22" ry="22" fill="url(#shine)" />
  <!-- K letter -->
  <text x="12" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="56" fill="white" letter-spacing="-2">KT</text>
  <!-- Accent dot -->
  <circle cx="82" cy="22" r="7" fill="#f472b6" opacity="0.9" />
</svg>
